name: Release

# Push a tag to publish a release:  git tag v0.1.0 && git push origin v0.1.0
# The tag must match VERSION in compiler/pkg.caju. The packages are signed with the release key
# (the secret CAJU_RELEASE_KEY, whose public key is in compiler/upgrade.caju and install.sh):
# caju upgrade and install.sh refuse packages without a valid signature (docs/releasing.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bootstrap and package
        run: tools/release.sh
      - name: Test suite
        run: CAJU_ROOT=$PWD build/release/caju test
      - name: Test the installer with the package
        run: |
          CAJU_PACKAGE=dist/caju-linux-x86_64.tar.gz CAJU_HOME=$RUNNER_TEMP/caju CAJU_BIN_DIR=$RUNNER_TEMP/bin sh install.sh
          $RUNNER_TEMP/bin/caju run $RUNNER_TEMP/caju/examples/hello-world.caju
      - name: WebAssembly package (the compiler in wasm; self-compiles; browser test)
        run: CAJU=build/release/caju tools/wasm/package.sh
      - name: Test suite in WebAssembly
        run: CAJU_ROOT=$PWD build/release/caju test --target wasm tests/lang
      - name: Sign the packages (and check the signatures with the keys built into caju)
        env:
          CAJU_RELEASE_KEY: ${{ secrets.CAJU_RELEASE_KEY }}
        run: |
          for f in dist/caju-linux-x86_64.tar.gz dist/caju-wasm.tar.gz; do
            build/release/caju release sign --version "$TAG" "$f"
            build/release/caju release verify --version "$TAG" "$f"
          done
      - name: Test the installer with the signed package
        run: |
          CAJU_PACKAGE=dist/caju-linux-x86_64.tar.gz CAJU_REQUIRE_SIGNATURE=1 CAJU_HOME=$RUNNER_TEMP/caju2 CAJU_BIN_DIR=$RUNNER_TEMP/bin2 sh install.sh
      - name: Release notes (the section of CHANGELOG.md for this version)
        run: tools/changelog.sh "$TAG" > dist/NOTES.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/caju-linux-x86_64.tar.gz dist/caju-linux-x86_64.tar.gz.sha256 dist/caju-linux-x86_64.tar.gz.sig \
            dist/caju-wasm.tar.gz dist/caju-wasm.tar.gz.sha256 dist/caju-wasm.tar.gz.sig \
            --title "Caju $TAG" --notes-file dist/NOTES.md
